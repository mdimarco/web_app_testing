name: Deploy apps to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "runs/**"
      - "template/**"
      - "pipeline/agent/site.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# One deploy at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve the Pages base path
        id: base
        run: echo "prefix=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Build every app
        env:
          SITE_PREFIX: ${{ steps.base.outputs.prefix }}
        run: |
          shopt -s nullglob
          built=0; failed=0
          for dir in apps/*/; do
            app_id="$(basename "$dir")"
            [[ -f "$dir/package.json" ]] || continue
            base="${SITE_PREFIX%/}/apps/$app_id/"
            echo "::group::build $app_id (base=$base)"
            if (cd "$dir" \
                && npm install --no-fund --no-audit \
                && VITE_BASE="$base" npm run build); then
              built=$((built+1))
            else
              # A single broken app must not block publishing the others.
              echo "::warning title=Build failed::$app_id did not build; skipping"
              failed=$((failed+1))
            fi
            echo "::endgroup::"
          done
          echo "built=$built failed=$failed"

      - name: Assemble site/
        run: |
          pip install --quiet PyYAML
          cd pipeline && python -m agent.site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
