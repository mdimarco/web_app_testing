# Usage from the repo root:
#   APP=my-app docker compose -f docker/docker-compose.yml up dev
#   APP=my-app docker compose -f docker/docker-compose.yml run --rm build
#   docker compose -f docker/docker-compose.yml up gallery
#
# `dev` and `build` operate on a single app (apps/$APP).
# `gallery` serves every already-built app at http://localhost:8080/apps/<id>/.

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: webapp-env:latest
    command: dev
    volumes:
      - ../apps/${APP:?set APP=<app-id>}:/app
      - node_modules_dev:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_BASE: "/"

  build:
    build:
      context: .
      dockerfile: Dockerfile
    image: webapp-env:latest
    command: build
    volumes:
      - ../apps/${APP:?set APP=<app-id>}:/app
      - node_modules_build:/app/node_modules
    environment:
      VITE_BASE: "${VITE_BASE:-/}"

  preview:
    build:
      context: .
      dockerfile: Dockerfile
    image: webapp-env:latest
    command: preview
    volumes:
      - ../apps/${APP:?set APP=<app-id>}:/app
      - node_modules_preview:/app/node_modules
    ports:
      - "4173:4173"
    environment:
      VITE_BASE: "/"

  gallery:
    image: nginx:alpine
    volumes:
      - ../site:/usr/share/nginx/html:ro
      - ./gallery.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  node_modules_dev:
  node_modules_build:
  node_modules_preview:
