server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback scoped per app: /apps/<id>/anything -> /apps/<id>/index.html
    location ~ ^/apps/(?<app_id>[^/]+)/ {
        try_files $uri $uri/ /apps/$app_id/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets are immutable.
    location ~* /assets/.*\.(js|css|woff2?|png|jpg|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
